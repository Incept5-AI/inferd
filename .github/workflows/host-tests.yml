# Host-only tests (no GPU, no model weights): the native JSON parser, grammar/sampler, SSD tier and the front end's
# structured output, tool calls, stop strings, streaming and the benchmark SSE client. GPU and model gates are run on
# real Macs with engine/tools/release_gate.sh (CONTRIBUTING.md, "Release gate").
name: host-tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  host:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Native host tests (ASan + UBSan)
        working-directory: engine
        run: |
          mkdir -p build
          SAN="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          clang++ -std=c++20 -O1 $SAN tools/grammar_test.cc -o build/grammar_test
          clang++ -std=c++20 -O1 $SAN -Isrc tools/json_test.cc -o build/json_test
          clang++ -std=c++20 -O1 $SAN -Isrc tools/spill_test.cc -o build/spill_test
          ./build/grammar_test && ./build/json_test && ./build/spill_test
      - name: Front-end tests
        working-directory: engine/frontend
        run: |
          python -m pip install --quiet jinja2
          python test_structured.py
          python test_tools.py
          python test_stream.py
      - name: Benchmark client tests
        working-directory: bench
        run: python test_sse_client.py
