# Host-only tests (no GPU, no model weights): the native JSON parser and protocol helpers, grammar/sampler, SSD tier and
# the front end's hardening suite (auth, budgets, validation, Unicode, cancellation, disconnects over a real socket,
# context admission), structured output, tool calls, stop strings, streaming, the vLLM compatibility probe (fixture mode), the image decoder, the logits-gate
# fixtures and the benchmark SSE client. GPU and model gates are run on real Macs with engine/tools/release_gate.sh
# (CONTRIBUTING.md, "Release gate").
name: host-tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  host:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # test_run_start.sh compares run.sh with its pre-named-start version (git show)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Native host tests (ASan + UBSan)
        working-directory: engine
        run: |
          mkdir -p build
          SAN="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          clang++ -std=c++20 -O1 $SAN tools/grammar_test.cc -o build/grammar_test
          clang++ -std=c++20 -O1 $SAN -Isrc tools/json_test.cc -o build/json_test
          clang++ -std=c++20 -O1 $SAN -Isrc tools/spill_test.cc -o build/spill_test
          ./build/grammar_test && ./build/json_test && ./build/spill_test
      - name: Front-end tests
        working-directory: engine/frontend
        run: |
          python -m pip install --quiet -r ../requirements-test.txt
          python test_hardening.py
          python test_structured.py
          python test_tools.py
          python test_stream.py
          python test_image_decode.py
          python test_vllm_compat.py
      - name: Logits gate fixtures
        working-directory: engine
        run: python tools/test_ref_logits.py
      - name: run.sh tests (fake processes)
        working-directory: engine
        run: zsh test_run.sh && zsh test_run_start.sh
      - name: Benchmark client tests
        working-directory: bench
        run: python test_sse_client.py
