<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 309" role="img" aria-label="An agent comes back after others filled memory: time to its first token">
<style>
.bg{fill:#ffffff}.t{fill:#1d1d1b;font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.tick{fill:#6b6a65;font:11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.lab{fill:#1d1d1b;font:12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.val{fill:#1d1d1b;font:600 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.note{fill:#6b6a65;font:11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.grid{stroke:#e6e3dc;stroke-width:1}polyline.ln{fill:none!important;stroke-width:2.3}
.k-us{fill:#1f5fbf;stroke:#1f5fbf}.k-us2{fill:#7aa7e6;stroke:#7aa7e6}.k-o1{fill:#b0702e;stroke:#b0702e}
.k-o2{fill:#7b8a3a;stroke:#7b8a3a}.k-o3{fill:#8d8b85;stroke:#8d8b85}.k-o4{fill:#9a5aa8;stroke:#9a5aa8}
.ln.k-us{stroke-width:3.2}.ln.k-o2{stroke-dasharray:6 4}.ln.k-o3{stroke-dasharray:2 4}
@media (prefers-color-scheme:dark){.bg{fill:#1b1b1a}.t,.lab,.val{fill:#ecebe6}.tick,.note{fill:#a3a19a}.grid{stroke:#34332f}
.k-us{fill:#6aa3ff;stroke:#6aa3ff}.k-us2{fill:#9fc1f2;stroke:#9fc1f2}.k-o1{fill:#dba25f;stroke:#dba25f}
.k-o2{fill:#aebc6a;stroke:#aebc6a}.k-o4{fill:#c58fd2;stroke:#c58fd2}}
</style>
<rect class="bg" width="720" height="309" rx="10"/>
<text class="t" x="18" y="28">An agent comes back after others filled memory: time to its first token</text>
<rect class="k-o3" x="250" y="42" width="11" height="11" rx="2"/><text class="tick" x="265" y="52">recompute the context</text>
<rect class="k-us2" x="418.6" y="42" width="11" height="11" rx="2"/><text class="tick" x="433.6" y="52">restore from SSD</text>
<rect class="k-us" x="554.2" y="42" width="11" height="11" rx="2"/><text class="tick" x="569.2" y="52">agent-contexts API</text>
<line class="grid" x1="250.0" y1="64" x2="250.0" y2="271"/><text class="tick" x="250.0" y="285" text-anchor="middle">0.00</text>
<line class="grid" x1="350.0" y1="64" x2="350.0" y2="271"/><text class="tick" x="350.0" y="285" text-anchor="middle">5.31</text>
<line class="grid" x1="450.0" y1="64" x2="450.0" y2="271"/><text class="tick" x="450.0" y="285" text-anchor="middle">10.61</text>
<line class="grid" x1="550.0" y1="64" x2="550.0" y2="271"/><text class="tick" x="550.0" y="285" text-anchor="middle">15.92</text>
<line class="grid" x1="650.0" y1="64" x2="650.0" y2="271"/><text class="tick" x="650.0" y="285" text-anchor="middle">21.23</text>
<text class="lab" x="240" y="99.5" text-anchor="end">M5 Pro: resume after eviction</text>
<rect class="k-o3" x="250" y="72" width="284.5" height="13" rx="2"/><text class="val" x="540.5" y="82.0">15.10</text>
<rect class="k-us2" x="250" y="89" width="6.4" height="13" rx="2"/><text class="val" x="262.4" y="99.0">0.34</text>
<rect class="k-us" x="250" y="106" width="4.9" height="13" rx="2"/><text class="val" x="260.9" y="116.0">0.26</text>
<text class="lab" x="240" y="164.5" text-anchor="end">M6: resume after six ~11k fillers</text>
<rect class="k-o3" x="250" y="137" width="344.8" height="13" rx="2"/><text class="val" x="600.8" y="147.0">18.30</text>
<rect class="k-us2" x="250" y="154" width="12.6" height="13" rx="2"/><text class="val" x="268.6" y="164.0">0.67</text>
<rect class="k-us" x="250" y="171" width="8.1" height="13" rx="2"/><text class="val" x="264.1" y="181.0">0.43</text>
<text class="lab" x="240" y="229.5" text-anchor="end">M6: relaunch from a saved context</text>
<rect class="k-us2" x="250" y="219" width="38.8" height="13" rx="2"/><text class="val" x="294.8" y="229.0">2.06</text>
<rect class="k-us" x="250" y="236" width="21.9" height="13" rx="2"/><text class="val" x="277.9" y="246.0">1.16</text>
<text class="note" x="18" y="301">Seconds. Qwen3.8-27B 4-bit with DFlash2 on Mac minis.</text></svg>