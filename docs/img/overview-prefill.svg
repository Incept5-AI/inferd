<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 244" role="img" aria-label="One agent, 16k prompt: time to the first token (Qwen3.8-27B 4-bit)">
<style>
.bg{fill:#ffffff}.t{fill:#1d1d1b;font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
